<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0, viewport-fit=cover">
<title>管理员</title>
<style>
  /* ============ 全局 ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  [hidden] { display: none !important; }

  :root {
    --bg:     #EBEDF1;
    --brand:  #205285;
    --card:   #FFFFFF;
    --ink:    #030405;
    --danger: #C0392B;
    --ok:     #44B31F;
  }

  body {
    min-width: 375px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    background: #C9CDD4;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
                 "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .phone {
    position: relative;
    width: 375px;
    height: 826px;
    background: var(--bg);
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0, 0, 0, .10);
  }

  /* ============ 登录层 ============ */
  .login {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, .45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .login__box {
    width: 280px;
    background: #FFFFFF;
    border-radius: 12px;
    padding: 22px 20px;
    text-align: center;
  }

  .login__title {
    font-size: 16px;
    font-weight: 700;
    line-height: 1;
    color: #000000;
  }

  .login__input {
    margin-top: 18px;
    width: 100%;
    height: 42px;
    padding: 0 12px;
    border: 1px solid #DDDADA;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    text-align: center;
    outline: none;
  }

  .login__input:focus { border-color: var(--brand); }

  .login__btn {
    margin-top: 14px;
    width: 100%;
    height: 42px;
    border: 0;
    border-radius: 6px;
    background: var(--brand);
    color: #FFFFFF;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .login__hint {
    margin-top: 12px;
    font-size: 11px;
    font-weight: 300;
    line-height: 1.5;
    color: #A9AEB6;
  }

  /* ============ 标题与标签 ============ */
  .title {
    position: absolute;
    top: 54px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    color: #000000;
  }

  .tabs {
    position: absolute;
    left: 34.5px;
    top: 96px;
    width: 306px;
    height: 36px;
    display: flex;
    background: #FFFFFF;
    border-radius: 8px;
    padding: 3px;
    gap: 3px;
  }

  .tabs button {
    flex: 1;
    border: 0;
    border-radius: 6px;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    font-weight: 400;
    color: #7B8087;
    cursor: pointer;
  }

  .tabs button.is-active {
    background: var(--brand);
    color: #FFFFFF;
    font-weight: 700;
  }

  /* ============ 内容区 ============ */
  .panel {
    position: absolute;
    left: 0;
    right: 0;
    top: 144px;
    bottom: 0;
    overflow-y: auto;
    padding: 0 34.5px 40px;
    scrollbar-width: none;
  }

  .panel::-webkit-scrollbar { display: none; }

  /* ============ 小卡片（密码池 / 告警） ============ */
  .stat {
    background: var(--card);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .stat__label {
    font-size: 12px;
    font-weight: 400;
    line-height: 1.4;
    color: #7B8087;
  }

  .stat__value {
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    color: #000000;
    font-variant-numeric: tabular-nums;
  }

  .stat__value.is-low { color: var(--danger); }

  .stat__action {
    height: 30px;
    padding: 0 12px;
    border: 1px solid var(--brand);
    border-radius: 6px;
    background: #FFFFFF;
    color: var(--brand);
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .alert {
    background: var(--card);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
    font-size: 12px;
    font-weight: 300;
    line-height: 1.7;
    color: #7B8087;
  }

  .alert__title {
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    color: #000000;
    margin-bottom: 10px;
  }

  .alert__row {
    color: var(--danger);
  }

  /* ============ 订单卡片 ============ */
  .order {
    background: var(--card);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }

  .order.is-terminated { opacity: .55; }

  .order__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .order__no {
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
    color: #000000;
  }

  .order__state {
    font-size: 12px;
    font-weight: 400;
    line-height: 1;
    color: var(--brand);
  }

  .order__state.is-off { color: #A9AEB6; }
  .order__state.is-kill { color: var(--danger); }

  .order__meta {
    margin-top: 10px;
    font-size: 12px;
    font-weight: 300;
    line-height: 1.7;
    color: #7B8087;
  }

  .order__stop {
    margin-top: 12px;
    height: 32px;
    padding: 0 14px;
    border: 1px solid var(--danger);
    border-radius: 6px;
    background: #FFFFFF;
    color: var(--danger);
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .empty {
    padding: 60px 0;
    text-align: center;
    font-size: 13px;
    font-weight: 300;
    color: #A9AEB6;
  }

  /* ============ 结果文字区 ============ */
  .result-card {
    background: var(--card);
    border-radius: 8px;
    padding: 18px;
    font-size: 13px;
    font-weight: 400;
    line-height: 1.8;
    color: #33373C;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .result-card.is-empty {
    color: #A9AEB6;
    text-align: center;
    padding: 40px 18px;
  }

  .fetch-btn {
    margin-top: 12px;
    width: 100%;
    height: 40px;
    border: 0;
    border-radius: 7px;
    background: #B2D2EA;
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .fetch-btn:disabled { opacity: .5; cursor: default; }

  /* ============ 数据概览 ============ */
  .overview {
    background: var(--card);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }

  .overview__title {
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    color: #000000;
    margin-bottom: 10px;
  }

  .overview__row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 5px 0;
    font-size: 12px;
    font-weight: 300;
    line-height: 1.5;
    color: #7B8087;
  }

  .overview__row b {
    font-weight: 700;
    color: #000000;
    text-align: right;
  }

  .demo-note {
    margin-top: 14px;
    font-size: 11px;
    font-weight: 300;
    line-height: 1.5;
    color: #A9AEB6;
  }
</style>
</head>
<body>

  <main class="phone">

    <!-- 登录层 -->
    <div class="login" id="login">
      <div class="login__box">
        <p class="login__title">管理员登录</p>
        <input class="login__input" id="loginPwd" type="password"
               placeholder="请输入管理员口令" autocomplete="off">
        <button class="login__btn" type="button" id="loginBtn">进入后台</button>
        <p class="login__hint">演示口令 admin</p>
      </div>
    </div>

    <h1 class="title">管理员</h1>

    <div class="tabs">
      <button type="button" class="is-active" data-tab="orders">全部订单</button>
      <button type="button" data-tab="device">设备体检</button>
      <button type="button" data-tab="demand">需求分析</button>
    </div>

    <div class="panel" id="panel-orders"></div>

    <div class="panel" id="panel-device" hidden>
      <div class="overview" id="overview"></div>
      <div class="result-card is-empty" id="deviceResult">尚未获取，点击下方按钮生成体检单</div>
      <button class="fetch-btn" type="button" id="deviceBtn">获取设备体检单</button>
      <p class="demo-note">调用 /api/analyze，单次约 10~30 秒</p>
    </div>

    <div class="panel" id="panel-demand" hidden>
      <div class="result-card is-empty" id="demandResult">尚未获取，点击下方按钮生成运营建议</div>
      <button class="fetch-btn" type="button" id="demandBtn">获取需求分析</button>
      <p class="demo-note">调用 /api/user_demand，单次约 10~30 秒</p>
    </div>

  </main>

<script>
  (function () {

    /* ================= 1. 登录 ================= */
    var login    = document.getElementById('login');
    var loginPwd = document.getElementById('loginPwd');

    if (sessionStorage.getItem('sf_admin_ok') === '1') {
      login.hidden = true;
    }

    document.getElementById('loginBtn').addEventListener('click', function () {
      if (loginPwd.value.trim() !== 'admin') {
        alert('口令不正确');
        loginPwd.value = '';
        loginPwd.focus();
        return;
      }
      sessionStorage.setItem('sf_admin_ok', '1');
      login.hidden = true;
    });

    loginPwd.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });

    /* ================= 2. 订单数据（来自用户端 localStorage） ================= */
    function pad(n) { return n < 10 ? '0' + n : String(n); }

    function hm(ts) {
      var d = new Date(ts);
      return pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function dur(secs) {
      var s = Math.floor(secs || 0);
      return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
    }

    function getTerminated() {
      try { return JSON.parse(localStorage.getItem('sf_terminated') || 'null'); }
      catch (e) { return null; }
    }

    function loadOrders() {
      var list = [];

      var grid  = localStorage.getItem('selectedGrid');
      var start = Number(localStorage.getItem('sf_start_time'));
      var no    = localStorage.getItem('sf_order_no');

      if (grid && start) {
        list.push({
          no: no || '—', code: grid, live: true,
          start: start, secs: Math.floor((Date.now() - start) / 1000), fee: 0
        });
      }

      try {
        var hist = JSON.parse(localStorage.getItem('sf_orders') || '[]');
        if (Array.isArray(hist)) {
          hist.forEach(function (o) {
            list.push({
              no: o.no || '—', code: o.code || '—', live: false,
              start: o.start, secs: o.secs, fee: o.fee,
              category: o.category || '',
              state: o.state || '已完成'
            });
          });
        }
      } catch (e) {}

      return list;
    }

    /* ================= 3. 渲染订单面板 ================= */
    var panelOrders = document.getElementById('panel-orders');

    function renderOrders() {
      var orders = loadOrders();
      var term   = getTerminated();
      var html   = '';

      /* 密码池 */
      var pool = Number(localStorage.getItem('sf_pwd_pool') || 1000);
      var low  = pool < 300;

      html += '<div class="stat">' +
        '<div>' +
          '<p class="stat__label">一次性密码池余量</p>' +
          '<p class="stat__value' + (low ? ' is-low' : '') + '">' + pool + ' / 1000</p>' +
        '</div>' +
        '<button class="stat__action" type="button" id="refillBtn">模拟补卡</button>' +
      '</div>';

      /* 一次性应急码：管理员生成后告知用户 */
      var emergency = null;
      try { emergency = JSON.parse(localStorage.getItem('sf_emergency_code') || 'null'); } catch (e) {}

      html += '<div class="stat">' +
        '<div>' +
          '<p class="stat__label">一次性应急码</p>' +
          '<p class="stat__value">' + (emergency ? emergency.code : '—') + '</p>' +
        '</div>' +
        '<button class="stat__action" type="button" id="genCodeBtn">生成</button>' +
      '</div>';

      /* 异常告警 + 用户举报 */
      var alerts = [];
      try { alerts = JSON.parse(localStorage.getItem('sf_alerts') || '[]'); } catch (e) {}
      if (!Array.isArray(alerts)) alerts = [];

      var reports = [];
      try { reports = JSON.parse(localStorage.getItem('sf_reports') || '[]'); } catch (e) {}
      if (!Array.isArray(reports)) reports = [];

      var rows = [];

      reports.slice(0, 5).forEach(function (r) {
        rows.push('用户举报：' + (r.reason || '未说明') +
                  (r.code ? '（格口 ' + r.code + '）' : ''));
      });

      alerts.slice(0, 5).forEach(function (a) {
        rows.push(a.text || '开锁异常');
      });

      html += '<div class="alert">' +
        '<p class="alert__title">异常告警</p>';

      if (!rows.length) {
        html += '<span>暂无异常记录</span>';
      } else {
        rows.slice(0, 5).forEach(function (t) {
          html += '<p class="alert__row">' + t + '</p>';
        });
      }

      html += '</div>';

      /* 订单 */
      if (!orders.length) {
        html += '<p class="empty">暂无订单</p>';
      } else {
        orders.forEach(function (o, i) {
          var killed = (term && term.no && term.no === o.no) || o.state === '已终止';

          var stateText = killed ? '已终止' : (o.live ? '使用中' : '已完成');
          var stateCls  = killed ? 'is-kill' : (o.live ? '' : 'is-off');

          html += '<article class="order' + (killed ? ' is-terminated' : '') + '">' +
            '<div class="order__head">' +
              '<span class="order__no">#' + o.no + '</span>' +
              '<span class="order__state ' + stateCls + '">' + stateText + '</span>' +
            '</div>' +
            '<p class="order__meta">格口 ' + o.code +
              '<br>开锁 ' + (o.start ? hm(o.start) : '—') +
              '　时长 ' + dur(o.secs) +
              (o.fee ? '　费用 ¥ ' + Number(o.fee).toFixed(2) : '') +
            '</p>';

          if (o.live && !killed) {
            html += '<button class="order__stop" type="button" data-idx="' + i + '">强行终止</button>';
          }

          html += '</article>';
        });
      }

      panelOrders.innerHTML = html;

      /* 补卡 */
      document.getElementById('refillBtn').addEventListener('click', function () {
        localStorage.setItem('sf_pwd_pool', '1000');
        renderOrders();
      });

      /* 生成一次性应急码 */
      var genBtn = document.getElementById('genCodeBtn');
      if (genBtn) {
        genBtn.addEventListener('click', function () {
          var code = String(Math.floor(1000 + Math.random() * 9000));
          try {
            localStorage.setItem('sf_emergency_code', JSON.stringify({ code: code, at: Date.now() }));
          } catch (e) {}
          renderOrders();
        });
      }

      /* 终止 */
      Array.prototype.slice.call(panelOrders.querySelectorAll('.order__stop')).forEach(function (btn) {
        btn.addEventListener('click', function () {
          var idx = Number(btn.dataset.idx);
          var o   = orders[idx];
          if (!o) return;

          if (!window.confirm('确认强行终止订单 #' + o.no + '？终止后用户端将立即失效。')) return;

          try {
            localStorage.setItem('sf_terminated', JSON.stringify({
              no: o.no, code: o.code, at: Date.now()
            }));
          } catch (e) {}

          renderOrders();
        });
      });
    }

    /* ================= 数据概览（物品 / 格口 / 响应时间） ================= */
    function renderOverview() {
      var el = document.getElementById('overview');
      if (!el) return;

      var orders = loadOrders();

      /* 物品 TOP3 */
      var cat = {};
      orders.forEach(function (o) {
        if (!o.category) return;
        cat[o.category] = (cat[o.category] || 0) + 1;
      });

      var catList = Object.keys(cat).map(function (k) {
        return { name: k, n: cat[k] };
      }).sort(function (a, b) {
        return b.n - a.n;
      }).slice(0, 3);

      /* 格口按大小分类 */
      var size = { C: 0, D: 0, E: 0 };
      orders.forEach(function (o) {
        var p = (o.code || '').charAt(0).toUpperCase();
        if (size[p] !== undefined) size[p] += 1;
      });

      /* AI 平均响应时间 */
      var lat = [];
      try { lat = JSON.parse(localStorage.getItem('sf_latency') || '[]'); } catch (e) {}
      if (!Array.isArray(lat)) lat = [];

      var avg = lat.length
        ? Math.round(lat.reduce(function (a, b) { return a + b; }, 0) / lat.length)
        : 0;

      el.innerHTML =
        '<p class="overview__title">数据概览</p>' +
        '<div class="overview__row"><span>存放物品 TOP3</span><b>' +
          (catList.length
            ? catList.map(function (c) { return c.name + ' ×' + c.n; }).join('、')
            : '暂无') +
        '</b></div>' +
        '<div class="overview__row"><span>格口选择</span><b>小 ' + size.C +
          '　中 ' + size.D + '　大 ' + size.E +
        '</b></div>' +
        '<div class="overview__row"><span>AI 平均响应</span><b>' +
          (avg ? avg + ' ms' : '暂无') +
        '</b></div>';
    }

    renderOrders();
    renderOverview();

    /* ================= 4. 标签切换 ================= */
    var tabs = Array.prototype.slice.call(document.querySelectorAll('.tabs button'));
    var panels = {
      orders: document.getElementById('panel-orders'),
      device: document.getElementById('panel-device'),
      demand: document.getElementById('panel-demand')
    };

    tabs.forEach(function (btn) {
      btn.addEventListener('click', function () {
        tabs.forEach(function (b) { b.classList.remove('is-active'); });
        btn.classList.add('is-active');

        Object.keys(panels).forEach(function (key) {
          panels[key].hidden = (key !== btn.dataset.tab);
        });

        if (btn.dataset.tab === 'device') renderOverview();
      });
    });

    /* ================= 5. 设备体检 / 需求分析 ================= */
    function post(url, body, done) {
      var ctrl  = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 60000);

      fetch(url, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(body),
        signal:  ctrl.signal
      })
      .then(function (res) {
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) { done(null, data); })
      .catch(function (err) {
        clearTimeout(timer);
        done(err.name === 'AbortError' ? '请求超时，请重试' : '请求失败', null);
      });
    }

    function bindFetch(btnId, resultId, url, makePayload, label) {
      var btn = document.getElementById(btnId);
      var box = document.getElementById(resultId);

      btn.addEventListener('click', function () {
        btn.disabled = true;
        btn.textContent = '正在生成...';
        box.classList.remove('is-empty');
        box.textContent = '正在生成，约需 10~30 秒...';

        post(url, makePayload(), function (err, data) {
          btn.disabled = false;
          btn.textContent = label;

          if (err) {
            box.classList.add('is-empty');
            box.textContent = err;
            return;
          }
          box.textContent = data.result || '接口未返回内容';
        });
      });
    }

    bindFetch('deviceBtn', 'deviceResult',
      'https://extensions-pas-throws-coalition.trycloudflare.com/api/analyze',
      function () {
        var orders = loadOrders();
        return {
          device_id: 'Fridge-B12',
          date: new Date().toISOString().slice(0, 10),
          open_success: 80,
          open_fail: 25,
          remaining_temp_passwords: Number(localStorage.getItem('sf_pwd_pool') || 1000),
          large_grid_usage: '98%',
          small_grid_usage: '15%'
        };
      },
      '获取设备体检单');

    bindFetch('demandBtn', 'demandResult',
      'https://extensions-pas-throws-coalition.trycloudflare.com/api/user_demand',
      function () {
        return {
          device_id: 'Fridge-B12',
          date_range: '2026-10-01 至 2026-10-31',
          total_users: 450,
          active_users: 320,
          compartment_preferences: { large_grid_selected: '75%', small_grid_selected: '10%' },
          peak_hours: ['12:00 - 13:30 (利用率达 98%，经常需要排队)', '18:00 - 19:30 (利用率达 92%)'],
          behavior_anomalies: { reservation_cancel_rate: '24.5%', expired_items_rate: '12.0%' },
          user_feedback_keywords: ['大格口经常满', '饭点没位置', '忘了取件被扣费']
        };
      },
      '获取需求分析');

  })();
</script>

</body>
</html>
