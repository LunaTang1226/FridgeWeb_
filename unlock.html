<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>预约成功</title>
<script src="config.js"></script>
<style>
  /* ============ 全局 ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  [hidden] { display: none !important; }

  :root {
    --bg:   #F2F4F7;
    --brand:#205285;
    --btn:  #B2D2EA;
    --ink:  #030405;
    --spin: #1296DB;
  }

  body {
    min-width: 375px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    background: #C9CDD4;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
                 "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .phone {
    position: relative;
    width: 375px;
    height: 826px;
    background: var(--bg);
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0, 0, 0, .10);
  }

  /* ============ 标题：距上 69px ============ */
  .title {
    position: absolute;
    top: 69px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    color: #000000;
  }

  /* ============ 信息框 300 × 111 ============ */
  .info {
    position: absolute;
    left: 37.5px;                      /* (375 - 300) / 2 */
    top: 114px;                        /* 标题底 89 + 25 */
    width: 300px;
    height: 111px;
    background: #FFFFFF;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;           /* 三行整体垂直居中 */
    gap: 9px;                          /* 行间距 9px */
    padding-left: 29px;                /* 文字距框左边 29px */
  }

  .info p {
    font-size: 14px;
    font-weight: 400;
    line-height: 1;
    color: #6B7078;                    /* 浅色 */
    text-align: left;
  }

  /* ============ 密码开锁入口 ============ */
  .pwd-link {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 124px;
    text-align: center;
    font-size: 13px;
    font-weight: 400;
    line-height: 1;
    color: var(--brand);
    text-decoration: none;
    cursor: pointer;
  }

  .pwd-link:active { opacity: .7; }

  .pwd-input {
    position: absolute;
    left: 55px;
    bottom: 124px;
    width: 265px;
    height: 48px;
    padding: 0 16px;
    border: 1px solid #C7CBD2;
    border-radius: 7px;
    background: #FFFFFF;
    font-family: inherit;
    font-size: 16px;
    color: #000000;
    text-align: center;
    letter-spacing: 2px;
    outline: none;
  }

  .pwd-input::placeholder {
    font-size: 13px;
    letter-spacing: 0;
    color: #A9AEB6;
  }

  .pwd-input:focus { border-color: var(--brand); }

  .pwd-hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 180px;
    text-align: center;
    font-size: 11px;
    font-weight: 300;
    line-height: 1;
    color: #A9AEB6;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* 云端下发的一次性密码展示 */
  .pwd-cloud {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 202px;
    text-align: center;
  }

  .pwd-cloud__label {
    font-size: 11px;
    font-weight: 300;
    line-height: 1;
    color: #A9AEB6;
    margin-bottom: 9px;
  }

  .pwd-cloud__code {
    font-size: 34px;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: 8px;
    color: var(--brand);
    text-indent: 8px;              /* 抵消最后一个字符的字距，保持视觉居中 */
  }

  .pwd-cloud__note {
    margin-top: 8px;
    font-size: 11px;
    font-weight: 300;
    line-height: 1.5;
    color: #6E7378;
  }

  /* ============ 主按钮 ============ */
  .main-btn {
    position: absolute;
    left: 55px;
    bottom: 60px;
    width: 265px;
    height: 48px;
    border: 0;
    border-radius: 7px;
    background: var(--btn);
    color: var(--ink);
    font-family: inherit;
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background .18s ease;
  }

  .main-btn:hover  { background: #A6C9E4; }
  .main-btn:active { background: #9BC0DE; }

  /* ============ 开锁弹窗 ============ */
  .toast {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 246px;
    height: 159px;
    background: #FFFFFF;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 71px;
    z-index: 10;
  }

  .toast__text {
    font-size: 16px;
    font-weight: 400;
    line-height: 1;
    color: #000000;
    letter-spacing: 0.2px;
  }

  .spinner {
    position: relative;
    width: 40px;
    height: 40px;
    margin-top: 12px;
    animation: spinner-rotate 1s steps(8) infinite;
  }

  .spinner span {
    position: absolute;
    left: 50%;
    top: 8px;
    width: 4px;
    height: 12px;
    margin-left: -2px;
    border-radius: 2px;
    background: var(--spin);
    transform-origin: 2px 12px;
  }

  .spinner span:nth-child(1) { transform: rotate(0deg);   opacity: 1;   }
  .spinner span:nth-child(2) { transform: rotate(45deg);  opacity: .88; }
  .spinner span:nth-child(3) { transform: rotate(90deg);  opacity: .76; }
  .spinner span:nth-child(4) { transform: rotate(135deg); opacity: .64; }
  .spinner span:nth-child(5) { transform: rotate(180deg); opacity: .52; }
  .spinner span:nth-child(6) { transform: rotate(225deg); opacity: .40; }
  .spinner span:nth-child(7) { transform: rotate(270deg); opacity: .28; }
  .spinner span:nth-child(8) { transform: rotate(315deg); opacity: .16; }

  @keyframes spinner-rotate { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <main class="phone">

    <h1 class="title">预约成功</h1>

    <section class="info">
      <p>订单编号：<span id="orderNo">—</span></p>
      <p>柜口位置：西四六楼</p>
      <p>柜口编号：<span id="gridNo">C01</span></p>
    </section>

    <!-- 默认：蓝牙开锁 -->
    <div id="bleGroup">
      <a class="pwd-link" id="pwdLink">蓝牙开锁失败？使用一次性密码</a>
      <button class="main-btn" type="button" id="bleBtn">我已到柜，蓝牙开锁</button>
    </div>

    <!-- 密码开锁（默认隐藏） -->
    <div id="pwdGroup" hidden>
      <div class="pwd-cloud" id="pwdCloud" hidden>
        <p class="pwd-cloud__label">云端下发的一次性密码</p>
        <p class="pwd-cloud__code" id="pwdCloudCode">—</p>
        <p class="pwd-cloud__note">在门锁键盘上输入这 5 位，按 # 确认</p>
      </div>
      <input class="pwd-input" id="pwdInput" type="text" inputmode="numeric"
             autocomplete="off" maxlength="5" placeholder="请输入 5 位一次性密码">
      <p class="pwd-hint" id="pwdHint">点击此处向云端申领一次性密码</p>
      <button class="main-btn" type="button" id="pwdBtn">确认开锁</button>
    </div>

    <div class="toast" id="toast" hidden>
      <p class="toast__text" id="toastText">正在开锁...</p>
      <div class="spinner" id="toastSpinner" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
    </div>

  </main>

<script>
  (function () {

    /* ---------------- 格口编号 ---------------- */
    var grid = localStorage.getItem('selectedGrid') || 'C01';
    document.getElementById('gridNo').textContent = grid;

    /* ---------------- 订单编号 ----------------
       规则：今天日期 8 位 + 当天第几个使用冰箱的序号 3 位（不足补零）
       同一天内重复进入本页，沿用已生成的编号，不重复递增。       */
    function pad(n, len) {
      var s = String(n);
      while (s.length < len) s = '0' + s;
      return s;
    }

    var now = new Date();
    var today = '' + now.getFullYear() + pad(now.getMonth() + 1, 2) + pad(now.getDate(), 2);

    var orderNo = '';

    try {
      var saved = localStorage.getItem('sf_order_no');

      if (saved && saved.slice(0, 8) === today) {
        orderNo = saved;
      } else {
        var seqKey = 'sf_seq_' + today;
        var seq = Number(localStorage.getItem(seqKey) || 0) + 1;
        localStorage.setItem(seqKey, seq);
        orderNo = today + pad(seq, 3);
        localStorage.setItem('sf_order_no', orderNo);
      }
    } catch (e) {
      orderNo = today + '001';
    }

    /* 有真实订单时优先显示云端订单号，方便管理员按号核对 */
    var realId = '';
    try { realId = localStorage.getItem('sf_real_order') || ''; } catch (e) {}

    document.getElementById('orderNo').textContent = realId || orderNo;

    /* ---------------- 交互 ---------------- */
    var bleGroup     = document.getElementById('bleGroup');
    var pwdGroup     = document.getElementById('pwdGroup');
    var pwdLink      = document.getElementById('pwdLink');
    var pwdInput     = document.getElementById('pwdInput');
    var pwdHint      = document.getElementById('pwdHint');
    var pwdCloud     = document.getElementById('pwdCloud');
    var pwdCloudCode = document.getElementById('pwdCloudCode');
    var toast        = document.getElementById('toast');
    var toastText    = document.getElementById('toastText');
    var spinner      = document.getElementById('toastSpinner');

    /* ---------------- 一次性密码：向云端申领 ---------------- */
    var cloudCode  = '';            /* 云端下发的 5 位码 */
    var requesting = false;
    var cloudTried = false;

    function setHint(text, isError) {
      pwdHint.textContent = text;
      pwdHint.style.color = isError ? '#C0392B' : '#A9AEB6';
    }

    /* 本机暂存：刷新页面后仍能看到自己这单的码 */
    function cacheKey(orderId) { return 'sf_emg_' + orderId; }

    function readCachedCode(orderId) {
      try {
        var raw = localStorage.getItem(cacheKey(orderId));
        if (!raw) return '';
        var o = JSON.parse(raw);
        return (o && o.code) ? String(o.code) : '';
      } catch (e) { return ''; }
    }

    function saveCachedCode(orderId, code) {
      try {
        localStorage.setItem(cacheKey(orderId), JSON.stringify({ code: code, at: Date.now() }));
      } catch (e) {}
    }

    function showCloudCode(code, hintText) {
      cloudCode = code;
      pwdCloudCode.textContent = code || '—';
      pwdCloud.hidden = !code;
      setHint(hintText || '密码已下发，输入后点「确认开锁」');
    }

    function requestEmergency(force) {
      if (requesting) return;
      if (cloudTried && !force) return;

      var orderId = '';
      try { orderId = localStorage.getItem('sf_real_order') || ''; } catch (e) {}

      /* 没有真实订单（离线演示 / 建单失败）：沿用本地演示码 */
      if (!orderId) {
        cloudTried = true;
        setHint('离线模式：请联系管理员获取一次性密码');
        return;
      }

      /* 本单已经领过：直接显示，不重复占用卡池 */
      var cached = readCachedCode(orderId);
      if (cached) {
        cloudTried = true;
        showCloudCode(cached, '本单已申领过，这是刚才下发的密码');
        return;
      }

      requesting = true;
      setHint('正在向云端申领…');

      api('POST', '/api/emergency/request', { orderId: orderId })
        .then(function (d) {
          var code = String(d.code || '');
          if (code) saveCachedCode(orderId, code);
          showCloudCode(code, '密码已下发，输入后点「确认开锁」');
        })
        .catch(function (err) {
          var msg = String((err && err.message) || err);

          if (/404|order_not_found|订单不存在/.test(msg)) {
            setHint('云端找不到这个订单，请联系管理员', true);
          } else if (/403|order_inactive|不可用/.test(msg)) {
            setHint('这单未缴费或已结束，不能申领密码', true);
          } else if (/409|already_requested|申请过/.test(msg)) {
            var old = readCachedCode(orderId);
            if (old) showCloudCode(old, '本单已申领过，这是刚才下发的密码');
            else setHint('本单已申领过密码，本机没有记录，请联系管理员', true);
          } else if (/503|device_pool_empty|补池/.test(msg)) {
            setHint('云端备用码已用完，请联系管理员补池', true);
          } else {
            setHint('连不上云端，请联系管理员获取密码', true);
          }
        })
        .finally(function () {
          requesting = false;
          cloudTried = true;
        });
    }

    pwdLink.addEventListener('click', function () {
      bleGroup.hidden = true;
      pwdGroup.hidden = false;
      requestEmergency(false);
      pwdInput.focus();
    });

    pwdHint.addEventListener('click', function () {
      requestEmergency(true);
    });

    var API = FRIDGE_API.lock;

    function api(method, path, body) {
      var ctrl  = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 6000);

      return fetch(API + path, {
        method:  method,
        headers: { 'Content-Type': 'application/json' },
        body:    body === undefined ? undefined : JSON.stringify(body),
        signal:  ctrl.signal
      })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) throw new Error(data.message || ('HTTP ' + res.status));
          return data;
        });
      })
      .finally(function () { clearTimeout(timer); });
    }

    function sleep(ms) {
      return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    /* 真实开门：成功返回 true，任何失败返回 false */
    async function realOpen() {
      var orderId = '';
      try { orderId = localStorage.getItem('sf_real_order') || ''; } catch (e) {}
      if (!orderId) return false;

      try {
        var op = await api('POST', '/api/open', { orderId: orderId });

        for (var i = 0; i < 15; i++) {
          await sleep(400);
          var t = await api('GET', '/api/task/' + op.taskId);
          if (t.status === 'done')   return t.result === 'OK';
          if (t.status === 'failed') return false;
        }
        return false;
      } catch (e) {
        return false;
      }
    }

    async function runUnlock() {
      toast.hidden = false;
      toastText.textContent = '正在开锁...';
      spinner.hidden = false;

      var ok = await realOpen();

      if (!ok) {
        /* 降级：至少让「正在开锁」显示 1.2 秒 */
        console.log('[unlock] 真实开锁不可用，已降级为模拟');
        await sleep(1200);
      }

      toastText.textContent = '开锁成功';
      spinner.hidden = true;

      setTimeout(function () {
        window.location.href = 'using.html';
      }, 800);
    }

    document.getElementById('bleBtn').addEventListener('click', function (e) {
      e.currentTarget.disabled = true;
      runUnlock();
    });

    document.getElementById('pwdBtn').addEventListener('click', function (e) {
      var code = pwdInput.value.trim();

      /* 只接受 5 位数字（与云端卡池一致） */
      if (!/^\d{5}$/.test(code)) {
        alert('请输入 5 位数字密码');
        return;
      }

      /* 云端已下发：与云端返回的码比对 */
      if (cloudCode) {
        if (code !== cloudCode) {
          alert('密码不正确，请核对云端下发的 5 位密码');
          return;
        }
        e.currentTarget.disabled = true;
        runUnlock();
        return;
      }

      /* 离线演示：与管理员在本机生成的演示码比对 */
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem('sf_emergency_code') || 'null'); } catch (err) {}

      if (!saved || saved.code !== code) {
        alert('密码不正确，请向管理员确认');
        return;
      }

      /* 一次性：用过即作废 */
      try { localStorage.removeItem('sf_emergency_code'); } catch (err) {}

      e.currentTarget.disabled = true;
      runUnlock();
    });

    pwdInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('pwdBtn').click();
    });

  })();
</script>

<script src="zoom.js"></script>

</body>
</html>
